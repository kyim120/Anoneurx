  <meta property="og:site_name" content="Anoneurx" />

    content="Anoneurx builds innovative software, operating systems, AI, cloud, and open source technologies designed to empower developers." />

  <meta name="twitter:card" content="summary_large_image" />

    content="Anoneurx builds innovative software, operating systems, AI, cloud, and open source technologies designed to empower developers." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    rel="stylesheet" />

  <link rel="icon" type="image/png" href="/assets/logo.svg" />

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Anoneurx",
        "url": "https://anoneurx.com",
        "logo": "https://anoneurx.com/assets/logo.svg",
        "sameAs": []
      }
    </script>
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Anoneurx",
        "url": "https://anoneurx.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://anoneurx.com/apps/browse?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
